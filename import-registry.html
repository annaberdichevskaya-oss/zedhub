function headers(){return {"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"};}
function log(msg){var el=document.getElementById("log");el.style.display="block";el.textContent+=msg+"\n";el.scrollTop=el.scrollHeight;}

var existing = [];
var nextId = 1;
var nextNum = 39;

async function checkBase(){
  log("Читаю існуючі ордери з Supabase...");
  try {
    var res = await fetch(SUPA_BASE+"/orders?select=id,data&limit=10000",{headers:headers()});
    var rows = await res.json();
    existing = Array.isArray(rows)?rows.map(function(r){var d=r.data||{};d.id=r.id;return d;}):[];
    var maxId=0, maxNum=0;
    existing.forEach(function(o){
      if((o.id||0)>maxId)maxId=o.id;
      var m=String(o.order_id||"").match(/^ZED0*(\d{1,4})$/);
      if(m){var n=parseInt(m[1],10);if(n>maxNum)maxNum=n;}
    });
    nextId=maxId+1; nextNum=maxNum+1;
    log("В базі: "+existing.length+" ордерів. Останній ZED-номер: ZED"+String(maxNum).padStart(4,"0"));
    log("Нові отримають номери: ZED"+String(nextNum).padStart(4,"0")+" ... ZED"+String(nextNum+RECORDS.length-1).padStart(4,"0"));
    // duplicate check
    var keys={};existing.forEach(function(o){keys[(o.req_id||"")+"|"+(o.container||"")]=1;});
    var dups=RECORDS.filter(function(r){return keys[r.req_id+"|"+r.container];}).length;
    if(dups>0)log("⚠️ "+dups+" записів уже є в базі — вони будуть пропущені.");
    else log("Дублів з базою немає — все чисте.");
    document.getElementById("import-btn").disabled=false;
    log("Готово. Натискай кнопку 2.");
  } catch(e){ log("ПОМИЛКА: "+e.message); }
}

async function runImport(){
  document.getElementById("import-btn").disabled=true;
  document.getElementById("bar-wrap").style.display="block";
  var keys={};existing.forEach(function(o){keys[(o.req_id||"")+"|"+(o.container||"")]=1;});
  var ok=0,skip=0,fail=0;
  for(var i=0;i<RECORDS.length;i++){
    var r=RECORDS[i];
    var key=r.req_id+"|"+r.container;
    if(keys[key]){skip++;}
    else{
      var rec=JSON.parse(JSON.stringify(r));
      rec.id=nextId++;
      rec.order_id="ZED"+String(nextNum++).padStart(4,"0");
      rec._v=1;
      try{
        var res=await fetch(SUPA_BASE+"/orders",{method:"POST",headers:headers(),body:JSON.stringify({id:rec.id,data:rec,updated_at:new Date().toISOString()})});
        if(res.ok){ok++;keys[key]=1;}
        else{fail++;log("✗ "+rec.order_id+" ("+r.req_id+"): HTTP "+res.status);}
      }catch(e){fail++;log("✗ "+r.req_id+": "+e.message);}
    }
    document.getElementById("bar").style.width=Math.round((i+1)/RECORDS.length*100)+"%";
    if((i+1)%20===0)log("… "+(i+1)+"/"+RECORDS.length);
  }
  log("");
  log("ГОТОВО ✅  Додано: "+ok+" | Пропущено (дублі): "+skip+" | Помилок: "+fail);
  log("Відкрий ZED Hub і онови сторінку (Ctrl+Shift+R) — ордери з'являться.");
}
