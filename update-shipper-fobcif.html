var SUPPLIERS = {"TGHU6346174": "SHISHI JIUZHOUZHONGHE IMPORT AND EXPORT CO., LTD  11  конт.", "TLLU4275893": "YIWU PROSPERITY COMMODITY PROCUREMENT CO.，LTD  6  конт Зими", "ECMU7141230": "NINGBO JIAHAO APPLIANCE CO.,LIMITED  2 конт", "FFAU4414090": "NINGBO JIAHAO APPLIANCE CO.,LIMITED  3 конт", "CMAU8605878": "NINGBO JIAHAO APPLIANCE CO.,LIMITED  4 конт", "CMAU3860905": "NINGBO JIAHAO APPLIANCE CO.,LIMITED  5 конт", "TCKU7620771": "NINGBO JIAHAO APPLIANCE CO.,LIMITED  6 конт", "CMAU4818453": "SHISHI JIUZHOUZHONGHE IMPORT AND EXPORT CO., LTD", "CMAU7762548": "SHISHI JIUZHOUZHONGHE IMPORT AND EXPORT CO., LTD", "TXGU7879245": "NINGBO JIAHAO APPLIANCE CO.,LIMITED", "SEGU6371610": "YIWU PROSPERITY COMMODITY PROCUREMENT CO.，LTD  8 конт Зими", "CMAU8493700": "YIWU PROSPERITY COMMODITY PROCUREMENT CO.，LTD   конт Зими", "CMAU6742207": "RIVERSTAR/ Бангладеш  Зима", "CAIU3838642": "Tivoli / Бангладеш  Зима", "EITU1613130": "NINGBO (1)", "NGP3891558": "NINGBO JIAHAO APPLIANCE CO.,LIMITED", "S/O NO: NGP3956384": "NINGBO JIAHAO APPLIANCE CO.,LIMITED", "TRHU8288417": "NINGBO JIAHAO APPLIANCE CO.,LIMITED", "UETU6930747": "NINGBO JIAHAO APPLIANCE CO.,LIMITED", "EGSU6291851": "NINGBO (2)", "CAJU5225598": "SHISHI JIUZHOUZHONGHE IMPORT AND EXPORT CO., LTD", "TCNU2278336": "SHISHI JIUZHOUZHONGHE IMPORT AND EXPORT CO., LTD", "TCKU6982502": "SHISHI JIUZHOUZHONGHE IMPORT AND EXPORT CO., LTD", "UETU8679733": "HANYU IMP0RT AND EXPORT", "SEKU5919200": "YIWU PROSPERITY COMMODITY PROCUREMENT CO.，LTD", "SEKU4316095": "SHISHI JIUZHOUZHONGHE IMPORT AND EXPORT CO., LTD", "CMAU7303282": "SHISHI JIUZHOUZHONGHE IMPORT AND EXPORT CO., LTD", "BMOU5418443": "SHISHI JIUZHOUZHONGHE IMPORT AND EXPORT CO., LTD", "CMAU9186293": "Ningbo Jiahao", "LCL": "SHISHI JIUZHOUZHONGHE IMPORT AND EXPORT CO., LTD", "CXDU2109270": "RUIAN MINGBAO IMPORT & EXPORT CO., LTD  Осінь 26", "DRYU4552398": "WENZHOU MATROX SHOES CO.,LTD", "TEMU8028680": "WENZHOU MATROX SHOES CO.,LTD", "CMAU7279150": "YIWU PROSPERITY 2 конт Зими", "E 66896": "NINGBO JIAHAO APPLIANCE", "ECMU8082954": "YIWU PROSPERITY COMMODITY PROCUREMENT CO. LTD", "EGSU8025418": "YIWU LUOXI IMPORT & EXPORT CO., LTD", "BEAU6301544": "Nantong Beiaile Home Technology Co., Ltd", "OOCU0226832": "RUIAN MINGBAO IMPORT & EXPORT CO.,LTD"};

function headers(){return {"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"resolution=merge-duplicates"};}
function log(msg){var el=document.getElementById("log");el.style.display="block";el.textContent+=msg+"\n";el.scrollTop=el.scrollHeight;}
function norm(s){return String(s||"").trim().toUpperCase();}

async function runFix(){
  document.getElementById("run-btn").disabled = true;
  log("Читаю ордери з Supabase...");
  var res = await fetch(SUPA_BASE+"/orders?select=id,data&limit=10000",{headers:headers()});
  var rows = await res.json();
  var orders = Array.isArray(rows)?rows.map(function(r){var d=r.data||{};d.id=r.id;return d;}):[];
  log("В базі: "+orders.length+" ордерів.\n");

  var withContainer = orders.filter(function(o){ return o.container && String(o.container).trim(); });
  log("З номером контейнера: " + withContainer.length + "\n");

  var updated=0, unchanged=0, notFound=[];
  for (var j=0; j<withContainer.length; j++){
    var o = withContainer[j];
    var cont = norm(o.container);
    var supplier = SUPPLIERS[cont];
    if (!supplier) { notFound.push(o.container); continue; }

    if (o.carrier === supplier) { unchanged++; continue; }
    var old = o.carrier || "—";
    o.carrier = supplier;
    if (!o.supplier) o.supplier = supplier;
    o._v = (o._v||0)+1;
    try {
      var r2 = await fetch(SUPA_BASE+"/orders", {method:"POST", headers:headers(), body:JSON.stringify({id:o.id, data:o, updated_at:new Date().toISOString()})});
      if (r2.ok) { updated++; log("✓ "+o.order_id+" ("+o.container+"): "+old+" → "+supplier); }
      else { log("✗ "+o.order_id+": HTTP "+r2.status); }
    } catch(err){ log("✗ "+o.order_id+": "+err.message); }
  }

  log("");
  log("ГОТОВО ✅  Оновлено: "+updated+" | Вже правильно: "+unchanged+" | Не знайдено у файлі: "+notFound.length);
  if (notFound.length) log("Не знайдені: "+notFound.join(", "));
  log("Відкрий ZED Hub і онови сторінку (Ctrl+Shift+R).");
  document.getElementById("run-btn").disabled = false;
}
</script>
